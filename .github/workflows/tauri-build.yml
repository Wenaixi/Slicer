name: Tauri Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows .msi + .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true
          prerelease: false

  build-linux:
    name: Linux .deb + .AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          configFile: src-tauri/tauri.linux.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true

  build-android:
    name: Android .apk (release, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Init Android project
        run: cargo tauri android init

      - name: Patch app_name + identifier
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Slicer</string>|' src-tauri/gen/android/app/src/main/res/values/strings.xml
          sed -i 's|"com\.tauri\.dev"|"com.slicer.app"|g' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # 签名：android init 每次重建 gen/，所以 keystore + gradle 补丁都在 init 之后做。
      # Secrets: ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::ANDROID_KEY_BASE64 secret missing"
            exit 1
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          # keystore.properties 给 Gradle signingConfigs 用（Tauri 官方路径）
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF
          # 补丁 app/build.gradle.kts：加 release signingConfig
          APP_GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            # 顶部 import（若无）
            grep -q 'java.io.FileInputStream' "$APP_GRADLE" || sed -i '1i import java.io.FileInputStream\nimport java.util.Properties' "$APP_GRADLE"
            # 在 buildTypes 前插入 signingConfigs（若无）
            if ! grep -q 'signingConfigs' "$APP_GRADLE"; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("src-tauri/gen/android/app/build.gradle.kts")
          t = p.read_text()
          block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["password"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["password"] as String
                  }
              }
          '''
          # 插到 android { 内、buildTypes 之前
          needle = "buildTypes {"
          if needle in t and "signingConfigs" not in t:
              t = t.replace(needle, block + "\n    " + needle, 1)
          # release buildType 挂上 signingConfig
          import re
          t2 = re.sub(
              r'(getByName\("release"\)\s*\{)',
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              t,
              count=1,
          )
          p.write_text(t2)
          print("patched build.gradle.kts")
          print(p.read_text()[:2000])
          PY
            fi
          fi
          ls -la "$RUNNER_TEMP/keystore.jks" src-tauri/gen/android/keystore.properties

      # 根因：Maven Central 对 GHA 出口 429；但 kotlin-dsl 插件只在
      # gradlePluginPortal()，不能只用 GCS。策略：
      # 1) 清掉有毒的 init.gradle 覆盖
      # 2) 重写 settings 的 pluginManagement + dependencyResolutionManagement
      #    顺序：google → gradlePluginPortal → GCS mirror → mavenCentral
      # 3) 构建失败时 sleep 重试（429 通常几分钟后恢复）
      - name: Fix Gradle repositories (GCS + portal)
        run: |
          mkdir -p "$HOME/.gradle"
          # 不要用 init.gradle 覆盖 pluginManagement（会把 portal 冲掉）
          rm -f "$HOME/.gradle/init.gradle"

          # tauri android init 后 settings.gradle 只有两行 include + apply
          # 真正的 pluginManagement 在 buildSrc 或根 build；先找所有相关文件
          find src-tauri/gen/android -name '*.gradle*' -type f | sort

          # 写一份 settings 级仓库声明，插到 settings.gradle 最前面
          # PREFER_SETTINGS 强制依赖解析走这里，mavenCentral 经 GCS 优先
          cat > /tmp/repos-header.gradle <<'HDR'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  // GCS 镜像作 mavenCentral 的并行源，降低 429 概率
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
                  mavenCentral()
              }
          }
          HDR

          SETTINGS="src-tauri/gen/android/settings.gradle"
          # 若 settings 已有 pluginManagement 就跳过，否则前置
          if [ -f "$SETTINGS" ] && ! grep -q 'pluginManagement' "$SETTINGS"; then
            cat /tmp/repos-header.gradle "$SETTINGS" > /tmp/settings-new.gradle
            mv /tmp/settings-new.gradle "$SETTINGS"
          fi

          # buildSrc 是 kotlin-dsl 插件的真正消费者；单独给它补 repositories
          BUILDSRC_SET="src-tauri/gen/android/buildSrc/settings.gradle"
          BUILDSRC_SET_KTS="src-tauri/gen/android/buildSrc/settings.gradle.kts"
          BUILDSRC_BUILD="src-tauri/gen/android/buildSrc/build.gradle.kts"
          BUILDSRC_BUILD_G="src-tauri/gen/android/buildSrc/build.gradle"

          for f in "$BUILDSRC_SET" "$BUILDSRC_SET_KTS"; do
            if [ -f "$f" ] && ! grep -q 'gradlePluginPortal\|pluginManagement' "$f"; then
              cat /tmp/repos-header.gradle "$f" > /tmp/bs-set.gradle
              mv /tmp/bs-set.gradle "$f"
            fi
          done

          # buildSrc/build.gradle.kts 的 repositories 块也加 GCS + portal
          for f in "$BUILDSRC_BUILD" "$BUILDSRC_BUILD_G"; do
            if [ -f "$f" ]; then
              echo "=== $f before ===" && cat "$f"
              # 若没有 repositories，在 plugins 后插入
              if ! grep -q 'repositories' "$f"; then
                cat > /tmp/bs-build-patch.kts <<'PATCH'
          repositories {
              maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
              mavenCentral()
              gradlePluginPortal()
              google()
          }
          PATCH
                # 插到文件开头（buildscript 之前）
                cat /tmp/bs-build-patch.kts "$f" > /tmp/bs-build-new && mv /tmp/bs-build-new "$f"
              fi
            fi
          done

          echo "=== final settings.gradle ===" && cat "$SETTINGS"
          ls -la src-tauri/gen/android/buildSrc/ 2>/dev/null || echo "no buildSrc dir"
          find src-tauri/gen/android/buildSrc -type f 2>/dev/null | head -20 || true

      - name: Build release APK (arm64 only)
        # --target 短名 aarch64；--apk + --split-per-abi → 单架构 release 包
        # 429 时退避重试：45s / 120s / 300s
        run: |
          set +e
          delays="45 120 300"
          i=0
          for delay in $delays; do
            i=$((i+1))
            echo "::group::Android build attempt $i"
            cargo tauri android build --apk --target aarch64 --split-per-abi
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              exit 0
            fi
            echo "attempt $i failed (exit $code), sleeping ${delay}s before retry..."
            sleep "$delay"
          done
          exit 1

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先上传已签名 APK，并删掉 unsigned 与历史 debug 大包
          mapfile -t apks < <(find src-tauri/gen/android -name '*.apk' -type f | sort)
          echo "found APKs:"
          printf '  %s\n' "${apks[@]}"
          # 重命名成友好文件名再上传
          for f in "${apks[@]}"; do
            base=$(basename "$f")
            # 跳过明显的 intermediate
            case "$base" in
              *unsigned*)
                # 若同目录有已签名版本则跳过 unsigned
                signed_candidate="${f/-unsigned/}"
                if [ -f "$signed_candidate" ]; then
                  echo "skip unsigned (signed exists): $base"
                  continue
                fi
                # 没签上就也上传，但标名提醒
                out="Slicer_0.19.0_arm64-unsigned.apk"
                ;;
              *)
                out="Slicer_0.19.0_arm64.apk"
                ;;
            esac
            # 用实际 tag 版本号
            ver="${{ github.ref_name }}"
            ver="${ver#v}"
            out="Slicer_${ver}_arm64.apk"
            case "$base" in *unsigned*) out="Slicer_${ver}_arm64-unsigned.apk";; esac
            cp -f "$f" "/tmp/$out"
            gh release upload "${{ github.ref_name }}" "/tmp/$out" --clobber
          done
          # 清掉旧资产
          for stale in app-universal-debug.apk app-arm64-release-unsigned.apk; do
            gh release delete-asset "${{ github.ref_name }}" "$stale" --yes 2>/dev/null || true
          done

  build-html-zip:
    name: HTML portable .zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Build static site
        run: npm --prefix app run build

      - name: Zip dist/ as portable HTML bundle
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          cd app/dist
          zip -r "Slicer_${ver}_html-portable.zip" ./*

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          gh release upload "$ver" "app/dist/Slicer_${ver}_html-portable.zip" --clobber
          gh release delete-asset "${{ github.ref_name }}" slicer-html-portable.zip --yes 2>/dev/null || true
