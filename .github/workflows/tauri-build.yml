name: Tauri Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows .msi + .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true
          prerelease: false

  build-linux:
    name: Linux .deb + .AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          configFile: src-tauri/tauri.linux.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true

  build-android:
    name: Android .apk (release, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Init Android project
        run: cargo tauri android init

      - name: Patch app_name + identifier
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Slicer</string>|' src-tauri/gen/android/app/src/main/res/values/strings.xml
          sed -i 's|"com\.tauri\.dev"|"com.slicer.app"|g' src-tauri/gen/android/app/src/main/AndroidManifest.xml
        # the sed patterns above are best-effort; verify with grep after

      - name: Build release APK (arm64 only)
        # --target 短名 aarch64（不是 aarch64-linux-android triple）
        # --apk 只产 APK；--split-per-abi 单架构包，体积更小
        run: cargo tauri android build --apk --target aarch64 --split-per-abi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 上传 arm64 release APK，并删掉历史 universal debug 大包（若还在）
          find src-tauri/gen/android -name '*.apk' -type f -print0 | xargs -0 -r gh release upload "${{ github.ref_name }}" --clobber
          gh release delete-asset "${{ github.ref_name }}" app-universal-debug.apk --yes 2>/dev/null || true

  build-html-zip:
    name: HTML portable .zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Build static site
        run: npm --prefix app run build

      - name: Zip dist/ as portable HTML bundle
        run: |
          cd app/dist
          zip -r slicer-html-portable.zip ./*

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/dist/slicer-html-portable.zip
          fail_on_unmatched_files: true
