name: Tauri Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows .msi + .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true
          prerelease: false

  build-linux:
    name: Linux .deb + .AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: --config src-tauri/tauri.linux.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Slicer ${{ github.ref_name }}'
          releaseBody: 'See assets to download this version.'
          releaseDraft: true

  build-android:
    name: Android .apk (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Install npm deps
        run: npm --prefix app ci

      - name: Init Android project
        run: cargo tauri android init

      - name: Patch app_name + identifier
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Slicer</string>|' src-tauri/gen/android/app/src/main/res/values/strings.xml
          sed -i 's|"com\.tauri\.dev"|"com.slicer.app"|g' src-tauri/gen/android/app/src/main/AndroidManifest.xml
        # the sed patterns above are best-effort; verify with grep after

      - name: Build debug APK
        run: cargo tauri android build -- --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: slicer-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
